[project]
name = "midea-json-agent"
version = "0.1.0"
description = "Midea engineering JSON agent prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<1.0",
  "uvicorn[standard]>=0.40,<1.0",
  "langgraph>=1.0,<2.0",
  "pydantic>=2.12,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
]
postgres = [
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
